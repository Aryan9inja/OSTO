name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Go tests
        run: go test ./...

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for containers..."
          sleep 10
          docker compose ps

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Check PostgreSQL
        run: |
          docker compose exec -T postgres \
            pg_isready -U authuser -d authdb

      - name: Debug services
        run: |
          docker compose ps
          echo "===== SERVER LOGS ====="
          docker compose logs server
          echo "===== POSTGRES LOGS ====="
          docker compose logs postgres

      - name: Check server responds
        run: |
          for i in {1..12}; do
            echo "Attempt $i..."
            if curl -sS http://localhost:8080; then
              echo "Server is reachable"
              exit 0
            fi
            sleep 5
          done

          echo "Server did not become reachable"
          docker compose logs server
          exit 1

      - name: Stop services
        if: always()
        run: docker compose down -v
